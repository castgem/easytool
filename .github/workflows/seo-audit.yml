name: SEO audit

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'public/locales/**'
      - 'scripts/generate-i18n-pages.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'scripts/seo-audit.mjs'
      - 'src/partials/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      SITE_URL: https://www.usetooleasy.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: SEO audit
        run: pnpm run seo-audit
