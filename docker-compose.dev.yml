# Local development: bind all interfaces on port 8080 (no search-engine noindex).
services:
  tooleasy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SIMPLE_MODE: 'false'
        SITE_URL: 'http://localhost:8080'
    image: tooleasy:local
    container_name: tooleasy
    restart: unless-stopped
    ports:
      - '8080:8080'
