{{#if simpleMode}} {{> navbar-simple}} {{else}}
<nav class="site-nav bg-gray-800 border-b border-gray-700 sticky top-0 z-40">
  <div class="container mx-auto px-4">
    <div class="site-nav__bar">
      <div
        class="site-nav__brand flex-shrink-0 flex items-center cursor-pointer"
        id="home-logo"
      >
        <img
          id="nav-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}ToolEasy{{/if}} Logo"
          class="h-8 w-8"
        />
        <span id="nav-brand" class="text-white font-bold text-xl ml-2">
          {{#if brandName}}
          <a href="index.html">{{brandName}}</a>
          {{else}}
          <a href="index.html" data-i18n="brand.name">ToolEasy</a>
          {{/if}}
        </span>
      </div>

      <!-- Desktop Navigation (centered) -->
      <div
        class="site-nav__menu hidden md:flex items-center justify-center space-x-1 lg:space-x-2"
      >
        <a href="index.html" class="nav-link" data-i18n="nav.home">Home</a>

        <a
          href="pdf-workflow.html"
          class="nav-link nav-link--featured"
          data-i18n="nav.pdfWorkflow"
          >PDF Workflow</a
        >
        <a
          href="pdf-multi-tool.html"
          class="nav-link nav-link--featured"
          data-i18n="nav.pdfMultiTool"
          >PDF Multi Tool</a
        >

        <div id="tools-mega" class="tools-mega">
          <div class="tools-mega__triggers">
            <button
              type="button"
              id="tools-mega-trigger"
              class="nav-link tools-mega__trigger tools-mega__trigger--all"
              aria-expanded="false"
              aria-haspopup="true"
              aria-controls="tools-mega-panel"
            >
              <span data-i18n="nav.allTools">All Tools</span>
              <i
                data-lucide="chevron-down"
                class="w-4 h-4 tools-mega__chevron"
              ></i>
            </button>
            <div
              id="tools-mega-top-cats"
              class="tools-mega__top-cats"
              aria-label="Tool categories"
            ></div>
          </div>

          <div
            id="tools-mega-panel"
            class="tools-mega__panel hidden"
            role="menu"
            aria-label="Tools"
          >
            <div class="tools-mega__inner">
              <div
                id="tools-mega-cats"
                class="tools-mega__cats"
                role="tablist"
              ></div>
              <div id="tools-mega-tools" class="tools-mega__content"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right slot: keeps menu optically centered; hamburger on mobile -->
      <div class="site-nav__end">
        <div class="md:hidden flex items-center justify-end">
          <button
            id="mobile-menu-button"
            type="button"
            class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500 transition-colors"
            aria-controls="mobile-menu"
            aria-expanded="false"
          >
            <span class="sr-only" data-i18n="nav.openMainMenu"
              >Open main menu</span
            >
            <svg
              id="menu-icon"
              class="block h-6 w-6"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
            <svg
              id="close-icon"
              class="hidden h-6 w-6"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div
    id="mobile-menu"
    class="hidden md:hidden bg-gray-800 border-t border-gray-700"
  >
    <div class="px-2 pt-2 pb-3 space-y-1 text-center">
      <a href="index.html" class="mobile-nav-link" data-i18n="nav.home">Home</a>
      <a
        href="pdf-workflow.html"
        class="mobile-nav-link"
        data-i18n="nav.pdfWorkflow"
        >PDF Workflow</a
      >
      <a
        href="pdf-multi-tool.html"
        class="mobile-nav-link"
        data-i18n="nav.pdfMultiTool"
        >PDF Multi Tool</a
      >
      <div id="mobile-tools-menu" class="text-left"></div>
    </div>
  </div>
</nav>
{{/if}}
