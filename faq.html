<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>常见问题</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://www.usetooleasy.com/#faq" />
    <script>
      (function () {
        var langs =
          /\/(en|ar|be|ru|fr|de|es|zh|zh-TW|vi|tr|id|it|pt|nl|da|sv|ko|ja|uk|sk)(?:\/|$)/;
        var match = location.pathname.match(langs);
        var prefix = match ? '/' + match[1] + '/' : '/';
        location.replace(prefix + '#faq');
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=/#faq" />
  </head>
  <body>
    <p><a href="/#faq">前往常见问题</a></p>
  </body>
</html>
