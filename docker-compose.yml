services:
  tooleasy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SIMPLE_MODE: 'false'
        SITE_URL: 'https://usetooleasy.com'
    image: tooleasy:local
    container_name: tooleasy
    restart: unless-stopped
    ports:
      - '127.0.0.1:18081:8080'
    environment:
      - ROBOTS_NOINDEX=true
